name: Copilot Label Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]

jobs:
  require-copilot-completed-label:
    if: startsWith(github.event.pull_request.head.ref, 'copilot/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Check for required label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => (l.name || '').toLowerCase());
            if (!labels.includes('copilot-completed')) {
              core.setFailed("Missing required 'copilot-completed' label on Copilot PR.");
            } else {
              core.notice("Found 'copilot-completed' label; gate passed.");
            }
