# Nginx config when Nginx runs INSIDE Docker (market-bot-nginx).
# Proxies to frontend CONTAINER on tunnel_network (market-pie5-bot-frontend:80).
# Use this when frontend runs in Docker; avoids host.docker.internal and wrong port.

upstream market_bot_frontend {
    server market-pie5-bot-frontend:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name market-bot.example.com;

    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    access_log /var/log/nginx/market-bot-access.log;
    error_log /var/log/nginx/market-bot-error.log;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy all requests to the frontend (including API calls that are proxied there)
    location / {
        proxy_pass http://market_bot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
    }
}
