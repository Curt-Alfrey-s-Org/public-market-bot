# Alembic Configuration File
# Generated for bot authentication database migrations
# PostgreSQL Migration - DATABASE_URL is read from environment in env.py
#
# Every option must live inside a [section]: the old file put sqlalchemy.url
# before any section header, so configparser refused to load it, and
# script_location ended up in [formatter_generic] (review 2026-09-25).

[alembic]
script_location = alembic
prepend_sys_path = .
# Split prepend_sys_path on os.pathsep (Alembic >= 1.16; ignored by older versions).
path_separator = os

# The URL is read from the DATABASE_URL environment variable in alembic/env.py.
# This placeholder is only a fallback for offline migrations.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
