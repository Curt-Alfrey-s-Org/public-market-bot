[pytest]
# Test discovery patterns
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest options
addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=10
    --capture=no
    --ignore=venv
    --ignore=node_modules
    --ignore=.git
    --ignore=__pycache__
    # Coverage options — scope to the deployed API service (what the backend
    # suite targets); root-level legacy scripts are excluded until the
    # deferred root cleanup lands
    --cov=api
    --cov=database
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-report=html
    # Exclude test and demo files from coverage
    --cov-config=.coveragerc
    # JUnit XML for CI
    --junit-xml=reports/junit.xml

# Test markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end tests for full workflows
    slow: Tests that take a long time to run
    api: Tests that require external API access
    gui: Tests for GUI components
    security: Security-related tests
    performance: Performance and benchmark tests

# Filterwarnings
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:pytest_cov.*
    ignore::DeprecationWarning:websockets.*
    ignore::PendingDeprecationWarning
    ignore:.*Timestamp.utcnow.*

# Minimum pytest version (not Python version - see requirements.txt for Python requirements)
minversion = 6.0

# Console output format
console_output_style = progress

# Test timeout (in seconds, requires pytest-timeout)
# timeout = 300

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio configuration (for async tests)
asyncio_mode = auto
