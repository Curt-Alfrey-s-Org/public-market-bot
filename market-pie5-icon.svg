<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#2E7D32" opacity="0.9"/>
  
  <!-- Pie chart segments -->
  <g transform="translate(64,64)">
    <!-- Red segment -->
    <path d="M 0,-35 A 35,35 0 0,1 30.3,-17.5 L 0,0 Z" fill="#E53935" opacity="0.9"/>
    <!-- Blue segment -->
    <path d="M 30.3,-17.5 A 35,35 0 0,1 30.3,17.5 L 0,0 Z" fill="#1E88E5" opacity="0.9"/>
    <!-- Yellow segment -->
    <path d="M 30.3,17.5 A 35,35 0 0,1 0,35 L 0,0 Z" fill="#FDD835" opacity="0.9"/>
    <!-- Purple segment -->
    <path d="M 0,35 A 35,35 0 0,1 -30.3,17.5 L 0,0 Z" fill="#8E24AA" opacity="0.9"/>
    <!-- Orange segment -->
    <path d="M -30.3,17.5 A 35,35 0 0,1 -30.3,-17.5 L 0,0 Z" fill="#FF6F00" opacity="0.9"/>
    <!-- Green segment -->
    <path d="M -30.3,-17.5 A 35,35 0 0,1 0,-35 L 0,0 Z" fill="#43A047" opacity="0.9"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="15" fill="#FFFFFF"/>
  </g>
  
  <!-- Pi symbol (π) in center -->
  <text x="64" y="74" font-family="serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2E7D32">π</text>
  
  <!-- Bot indicator - small gear/cog at bottom -->
  <g transform="translate(64,100)">
    <circle cx="0" cy="0" r="8" fill="#455A64"/>
    <circle cx="0" cy="0" r="5" fill="#ECEFF1"/>
    <!-- Gear teeth -->
    <circle cx="0" cy="-8" r="2" fill="#455A64"/>
    <circle cx="5.7" cy="-5.7" r="2" fill="#455A64"/>
    <circle cx="8" cy="0" r="2" fill="#455A64"/>
    <circle cx="5.7" cy="5.7" r="2" fill="#455A64"/>
    <circle cx="0" cy="8" r="2" fill="#455A64"/>
    <circle cx="-5.7" cy="5.7" r="2" fill="#455A64"/>
    <circle cx="-8" cy="0" r="2" fill="#455A64"/>
    <circle cx="-5.7" cy="-5.7" r="2" fill="#455A64"/>
  </g>
  
  <!-- Trading/financial indicator - upward arrow -->
  <g transform="translate(100,28)">
    <path d="M 0,0 L -4,4 L -2,4 L -2,10 L 2,10 L 2,4 L 4,4 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.5"/>
  </g>
  
  <!-- Raspberry Pi "5" indicator -->
  <text x="28" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" opacity="0.9">5</text>
</svg>
